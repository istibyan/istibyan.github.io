  add(`<h3>${t('future')}</h3><ul>${ins.future.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`);
  // appendix
  add(`<h2>${t('rpAppendix')}</h2><p><b>${esc(sv.title)}</b></p><p style="white-space:pre-line">${esc(sv.description)}</p>`, true);
  if (demoOn().length) add(`<h3>${t('aboutYou')}</h3><table><thead><tr><th>${t('rpQ')}</th><th>${t('rpOptions')}</th></tr></thead><tbody>${demoOn().map(k => `<tr><td>${t('d_'+k)}</td><td>${k === 'name' ? (sv.demographics.name.anon === false ? t('required') : t('optional')) : demoOpts(k).map(esc).join(' · ')}</td></tr>`).join('')}</tbody></table>`);
  let qn = 0; sv.sections.forEach((sec, si) => { add(`<h3>${t('section')} ${si+1}: ${esc(sec.title)}</h3>`);
    sec.items.forEach(q => { qn++; add(`<table><tbody><tr><td style="width:8%">Q${qn}</td><td>${esc(q.text)}${q.type === 'mc' ? `<div style="color:#64748b;font-size:11px">${(q.opts||[]).map(esc).join(' · ')}</div>` : q.type === 'likert' ? `<div style="color:#64748b;font-size:11px">${[1,2,3,4,5].map(k => t('lk'+k)).join(' · ')}</div>` : ''}</td><td style="width:20%;color:#64748b">${typeLabel(q.type)}</td></tr></tbody></table>`); }); });
  return { B, dateStr };
}
function buildReportDOM(A, ins){
  const root = document.getElementById('report-root'); root.innerHTML = ''; root.setAttribute('dir', S.lang === 'ar' ? 'rtl' : 'ltr'); root.setAttribute('lang', S.lang);
  const { B, dateStr } = reportBlocks(A, ins); const sv = S.survey; const pages = [];
  const cover = document.createElement('div'); cover.className = 'rp cover';
  cover.innerHTML = `<div class="band"></div><div class="cv"><div style="display:flex;align-items:center;gap:10px;font-weight:800;color:#1f6659">${I.logo}<span>${t('appName')} · ${t('appSub')}</span></div>
    <div class="sub" style="margin-top:120px">${t('rpSub')}</div><h1>${esc(sv.title)}</h1><p style="color:#475569;font-size:14px;max-width:560px;white-space:pre-line">${esc(sv.description)}</p>
    ${A.src === 'demo' ? `<div style="margin-top:14px"><span class="demo-flag">${t('rpDemoFlag')}</span></div>` : ''}
    <div class="meta"><div><small>${t('rpDate')}</small><strong>${dateStr}</strong></div><div><small>${t('rpSample')}</small><strong>${A.n}</strong></div><div><small>${t('rpCompletion')}</small><strong>${fmt(A.completion,1)}%</strong></div><div><small>${t('rpOverall')}</small><strong>${fmt(A.overall.mean)} / 5</strong></div></div></div>`;
  root.appendChild(cover); pages.push(cover);
  let body = null;
  const newPage = () => { const p = document.createElement('div'); p.className = 'rp'; p.innerHTML = `<div class="rp-head"><b>${esc(qShort(sv.title))}</b><span>${t('rpSub')}</span></div><div class="rp-body"></div><div class="rp-foot"><span>${t('appName')} · ${dateStr}</span><span class="pg"></span></div>`; root.appendChild(p); pages.push(p); body = p.querySelector('.rp-body'); };
  newPage();
  B.forEach(b => { if (b.np && body.children.length) newPage(); const w = document.createElement('div'); w.innerHTML = b.html; body.appendChild(w); drawDonuts(w, RP_CAT);
    if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) { body.removeChild(w); newPage(); body.appendChild(w); } });
  pages.forEach((p, i) => { const pg = p.querySelector('.pg'); if (pg) pg.textContent = t('rpPage', { i: i+1, n: pages.length }); });
  return pages;
}
async function exportPdf(){
  const A = getA();
  if (!A.n) { toast(t('pdfEmpty')); return; }
  if (!window.html2canvas || !window.jspdf) { toast(t('pdfLibs')); return; }
  const ins = insightsFor(A);
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}
  S.busy = { msg: t('pdfBuilding', { i: 0, n: '…' }) }; renderModal();
  let pdf, imgs = [];
  try {
    const pages = buildReportDOM(A, ins);
    pdf = new window.jspdf.jsPDF({ unit:'pt', format:'a4', compress:true });
    for (let i = 0; i < pages.length; i++) {
      S.busy.msg = t('pdfBuilding', { i: i+1, n: pages.length }); renderModal();
      const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor:'#ffffff', logging:false, useCORS:false, windowWidth: 900 });
      const img = canvas.toDataURL('image/jpeg', 0.9); imgs.push(img);
      if (i) pdf.addPage(); pdf.addImage(img, 'JPEG', 0, 0, 595.28, 841.89, undefined, 'FAST');
    }
  } catch(e) { console.error(e); S.busy = null; renderModal(); document.getElementById('report-root').innerHTML = ''; toast(t('pdfFailed')); return; }
  S.busy = null; renderModal(); document.getElementById('report-root').innerHTML = '';
  const fname = (S.survey.title || 'survey').replace(/[\\/:*?"<>|]+/g, '').slice(0, 80).trim() + (A.src === 'demo' ? ' (demo)' : '') + ' - report.pdf';
  try { pdf.save(fname); toast(t('pdfSaved')); }
  catch(e) { console.error(e); S.modal = { kind:'preview', msg: t('pdfFailed'), pages: imgs }; renderModal(); }
}

/* ---------------- routing ---------------- */
const TABS = ['setup','questions','share','take','results'];
function parseHash(){ const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] === 'r' && p[1]) return { name:'respond', id: p[1] };
  if (p[0] === 'edit' && p[1]) return { name:'edit', id: p[1], tab: TABS.includes(p[2]) ? p[2] : 'setup' };
  return { name:'home' }; }
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
async function route(force){
  const r = parseHash(); const prev = S.route; S.route = r;
  if (r.name === 'edit') {
    S.tab = r.tab;
    if (S.mode === 'cloud' && !S.user) { Store.stop(); S.survey = null; }
    else if (force || prev.name !== 'edit' || prev.id !== r.id) { if (Store.mineUnsub) { Store.mineUnsub(); Store.mineUnsub = null; } Store.open(r.id); S.src = null; }
    if (S.tab === 'take' && S.take && S.take.done) S.take = null;
  } else if (r.name === 'respond') {
    if (force || prev.name !== 'respond' || prev.id !== r.id) {
      Store.stop(); if (Store.mineUnsub) { Store.mineUnsub(); Store.mineUnsub = null; }
      S.survey = null; S.loadErr = null; S.take = null; render();
      const sv = await Store.loadPublic(r.id);
      if (S.route !== r) return;
      if (!sv || sv.status !== 'published' || !Array.isArray(sv.sections)) S.loadErr = t('notFound');
      else { S.survey = sv; if (!lsGet('istb.lang') && (sv.lang === 'ar' || sv.lang === 'en')) S.lang = sv.lang;
        S.take = newTake(); const mine = await Store.myResponse(r.id); if (S.route !== r) return;
        if (mine && mine.status === 'complete') S.take.already = true; }
    }
  } else { Store.stop(); S.survey = null; S.loadErr = null; Store.watchMine(); }
  render(); window.scrollTo({ top: 0 });
}
function onAuth(){ if (S.route.name === 'respond') return; S.counts = {}; route(true); }
window.addEventListener('hashchange', () => route());

/* ---------------- main render ---------------- */
function render(){
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  renderTop();
  const main = document.getElementById('main');
  if (!S.ready) { main.innerHTML = `<div class="loading"><span class="spin"></span><span>${t('loading')}</span></div>`; return; }
  const r = S.route; let html;
  const loading = `<div class="loading"><span class="spin"></span><span>${t('loading')}</span></div>`;
  const errCard = (h, p) => `<div class="survey"><div class="card empty"><h2>${esc(h)}</h2><p>${esc(p || '')}</p><a class="btn" href="#/">${t('backToList')}</a></div></div>`;
  if (r.name === 'home') html = viewHome();
  else if (r.name === 'respond') html = S.survey ? viewTake() + `<p class="footer">${t('respondBrand')}</p>` : S.loadErr ? `<div class="survey"><div class="card empty"><h2>${t('notFound')}</h2><p>${t('notFoundBody')}</p></div></div>` : loading;
  else if (S.mode === 'cloud' && !S.user) html = viewHero();
  else if (!S.survey) html = S.loadErr ? errCard(S.loadErr) : loading;
  else { const tab = S.tab;
    html = crumb() + (tab === 'setup' ? viewSetup() : tab === 'questions' ? viewQuestions() : tab === 'share' ? viewShare() : tab === 'results' ? viewResults() : viewTake()); }
  main.innerHTML = html;
  drawDonuts(main);
  if (r.name === 'edit' && S.tab === 'share' && S.survey) drawQR();
  renderModal();
}

/* ---------------- events ---------------- */
function moveArr(a, i, d){ const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; }
function changed(structural){ Store.saveSurvey(); invalidate(); if (structural) render(); }
async function doGenerate(useAI){
  const sv = S.survey;
  if (useAI && (!(sv.summary||'').trim() || !(sv.title||'').trim())) { toast(t('needSummary')); return; }
  const n = countQ(sv);
  if (n && !(await confirmBox(t('replaceQ', { n }), t('replaceOk')))) return;
  let secs = null;
  if (useAI && S.ai) { try { secs = await aiGenerate(); } catch(e) { if (e && e.code === 'cancelled') return; toast(aiErrText(e), 7000); return; } }
  else { if (useAI) toast(t('aiOff'), 5000); secs = templateDraft(); }
  sv.sections = secs; changed(false); go('#/edit/' + S.route.id + '/questions');
  toast(t('genDone', { s: secs.length, q: countQ(sv) }), 5000);
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act; const sv = S.survey;
  const si = b.dataset.s != null ? +b.dataset.s : null, qi = b.dataset.q != null ? +b.dataset.q : null;
  switch (act) {
    case 'tab': if (S.route.name === 'edit') go('#/edit/' + S.route.id + '/' + b.dataset.tab); break;
    case 'lang': S.lang = S.lang === 'en' ? 'ar' : 'en'; lsSet('istb.lang', S.lang); invalidate(); render(); break;
    case 'sign-in': Store.signIn(); break;
    case 'sign-out': Store.signOut().then(() => go('#/')); break;
    case 'settings': S.modal = { kind:'settings' }; renderModal(); setTimeout(() => { const i = document.getElementById('api-key'); if (i) i.focus(); }, 30); break;
    case 'key-save': { const v = (document.getElementById('api-key').value || '').trim(); if (v) { lsSet('istb.apikey', v); toast(t('keySaved')); } else { lsDel('istb.apikey'); } S.ai = !!aiKey(); S.modal = null; render(); break; }
    case 'key-remove': lsDel('istb.apikey'); S.ai = false; S.modal = null; toast(t('keyRemoved')); render(); break;
    case 'new-blank': case 'new-example': { if (S.mode === 'cloud' && !S.user) break; const base = sampleSurvey(S.lang);
      if (act === 'new-blank') Object.assign(base, { title:'', description:'', summary:'', sections:[] });
      try { b.disabled = true; const id = await Store.create(base); go('#/edit/' + id + '/setup'); } catch(e){ console.error(e); toast(t('saveFailed')); b.disabled = false; } break; }
    case 'del-survey': { const s = (S.mine || []).find(x => x.id === b.dataset.id); if (!s) break;
      if (await confirmBox(t('delSurveyConfirm', { t: s.title || t('untitled') }), t('del'))) { try { await Store.remove(s.id); toast(t('deleted')); render(); } catch(e){ console.error(e); toast(t('loadFailed')); } } break; }
    case 'copy-link': copyText(respondUrl(b.dataset.id)); break;
    case 'copy-url': copyText(respondUrl(S.route.id), document.getElementById('share-url')); break;
    case 'qr-dl': { const box = document.getElementById('qr-box'); const c = box && box.querySelector('canvas'); const img = box && box.querySelector('img');
      const src = c ? c.toDataURL('image/png') : img && img.src; if (!src) break;
      const a = document.createElement('a'); a.href = src; a.download = (S.survey.title || 'questionnaire').replace(/[\\/:*?"<>|]+/g, '').slice(0, 60) + ' - QR.png';
      document.body.appendChild(a); a.click(); a.remove(); break; }
    case 'demo-toggle': if (b.tagName !== 'INPUT') return; sv.demographics[b.dataset.key] = Object.assign({ opts:null, anon:true }, sv.demographics[b.dataset.key], { on: b.checked }); changed(true); break;
    case 'demo-reset': sv.demographics[b.dataset.key].opts = null; changed(true); break;
    case 'name-anon': if (b.tagName !== 'INPUT') return; sv.demographics.name.anon = b.checked; changed(false); break;
    case 'gen-ai': doGenerate(true); break;
    case 'gen-tpl': doGenerate(false); break;
    case 'sec-add': sv.sections.push({ id: uid('s'), title: t('newSection'), items: [{ id: uid('q'), type:'likert', text:'', opts:null, req:true }] }); changed(true); break;
    case 'sec-up': moveArr(sv.sections, si, -1); changed(true); break;
    case 'sec-down': moveArr(sv.sections, si, 1); changed(true); break;
    case 'sec-del': { const s = sv.sections[si]; if (await confirmBox(t('delSConfirm', { s: s.title, n: s.items.length }), t('del'))) { sv.sections.splice(si, 1); changed(true); } break; }
    case 'q-add': sv.sections[si].items.push({ id: uid('q'), type:'likert', text:'', opts:null, req:true }); changed(true); setTimeout(() => { const ta = document.querySelectorAll(`[data-q-text^="${si}:"]`); if (ta.length) ta[ta.length-1].focus(); }, 30); break;
    case 'q-up': moveArr(sv.sections[si].items, qi, -1); changed(true); break;
    case 'q-down': moveArr(sv.sections[si].items, qi, 1); changed(true); break;
    case 'q-del': { const q = sv.sections[si].items[qi]; if (!q.text.trim() || !S.responses.length || await confirmBox(t('delQConfirm'), t('del'))) { sv.sections[si].items.splice(qi, 1); changed(true); } break; }
    case 'publish': sv.status = 'published'; changed(true); break;
    case 'unpublish': sv.status = 'draft'; changed(true); break;
    case 'take-start': startTake(); break;
    case 'take-next': if (!validateStep()) { render(); focusFirstError(); break; } S.take.step++; saveDraft(); render(); window.scrollTo({ top: 0 }); break;
    case 'take-back': S.take.errors = {}; S.take.step--; saveDraft(); render(); window.scrollTo({ top: 0 }); break;
    case 'take-submit': submitTake(); break;
    case 'take-again': S.take = newTake(); S.take.already = S.mode === 'cloud'; render(); break;
    case 'src': S.src = b.dataset.src; render(); break;
    case 'themes': { const A = getA(); const it = A.items[b.dataset.qid]; if (!it) break;
      try { const th = await aiThemes(A, it); slot(A.src).themes[it.q.id] = th; if (A.src === 'live') Store.saveInsights(); render(); }
      catch(e){ if (e && e.code !== 'cancelled') toast(aiErrText(e), 6000); } break; }
    case 'refine': { const A = getA(); try { const r = await aiInsights(A); slot(A.src).report = r; if (A.src === 'live') Store.saveInsights(); render(); }
      catch(e){ if (e && e.code !== 'cancelled') toast(aiErrText(e), 6000); } break; }
    case 'export': exportPdf(); break;
    case 'busy-stop': if (S.busy && S.busy.ctl) S.busy.ctl.abort(); break;
    case 'modal-yes': case 'modal-no': { const m = S.modal; S.modal = null; renderModal(); if (m && m.res) m.res(act === 'modal-yes'); break; }
    case 'modal-close': S.modal = null; renderModal(); break;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target; const sv = S.survey; if (!sv) return;
  if (el.dataset.bind) { sv[el.dataset.bind] = el.value; changed(false); return; }
  if (el.dataset.demoOpts) { sv.demographics[el.dataset.demoOpts].opts = el.value.split('\n').map(x => x.trim()).filter(Boolean); changed(false); return; }
  if (el.dataset.secTitle != null) { sv.sections[+el.dataset.secTitle].title = el.value; changed(false); return; }
  if (el.dataset.qText) { const [s, q] = el.dataset.qText.split(':').map(Number); const it = sv.sections[s].items[q]; it.text = el.value; changed(false);
    const lb = document.getElementById('lint-' + it.id); if (lb) lb.innerHTML = lint(it).map(x => `<span class="pill warn">${esc(x)}</span>`).join(''); return; }
  if (el.dataset.qOpts) { const [s, q] = el.dataset.qOpts.split(':').map(Number); sv.sections[s].items[q].opts = el.value.split('\n').map(x => x.trim()).filter(Boolean); changed(false); return; }
  if (el.dataset.demoName != null && S.take) { S.take.demo.name = el.value; saveDraft(); return; }
  if (el.dataset.ansText && S.take) { S.take.ans[el.dataset.ansText] = el.value; if (el.value.trim()) { delete S.take.errors[el.dataset.ansText]; el.closest('fieldset').classList.remove('has-err'); } saveDraft(); return; }
});
document.addEventListener('change', ev => {
  const el = ev.target; const sv = S.survey; if (!sv) return;
  if (el.dataset.qType) { const [s, q] = el.dataset.qType.split(':').map(Number); const it = sv.sections[s].items[q]; it.type = el.value;
    if (it.type === 'mc' && !(it.opts && it.opts.length)) it.opts = S.lang === 'ar' ? ['الخيار الأول','الخيار الثاني','الخيار الثالث'] : ['Option 1','Option 2','Option 3'];
    if (it.type === 'open') it.req = false; changed(true); return; }
  if (el.dataset.qReq) { const [s, q] = el.dataset.qReq.split(':').map(Number); sv.sections[s].items[q].req = el.checked; changed(false); return; }
  if (el.dataset.cross != null) { S.cross = el.value; render(); return; }
  if (el.dataset.demo && S.take) { S.take.demo[el.dataset.demo] = +el.value; delete S.take.errors['d_' + el.dataset.demo]; el.closest('fieldset').classList.remove('has-err'); saveDraft(); return; }
  if (el.dataset.ans && S.take) { S.take.ans[el.dataset.ans] = +el.value; delete S.take.errors[el.dataset.ans]; el.closest('fieldset').classList.remove('has-err'); saveDraft(); return; }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (S.pendingRemote && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { S.survey = S.pendingRemote; S.pendingRemote = null; invalidate(); render(); } }, 50); });

/* ---------------- boot ---------------- */
async function boot(){
  const saved = lsGet('istb.lang'); S.lang = saved === 'ar' || saved === 'en' ? saved : ((navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en');
  render();
  await Store.init();
  S.ai = !!aiKey();
  S.ready = true;
  await route();
}
boot();
})();
