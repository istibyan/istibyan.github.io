<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build professional questionnaires with AI, share a link with your sample, analyze results and export a PDF report. English and Arabic.">
<title>Istibyan Survey Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='7' y='3' width='22' height='30' rx='4' fill='%232a8574'/%3E%3Crect x='26' y='21' width='4' height='16' rx='1.5' fill='%23e38c35'/%3E%3Crect x='32' y='15' width='4' height='22' rx='1.5' fill='%23f5a855'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f7f9fb; --surface:#ffffff; --surface-2:#f2f6f5; --line:#e2e8f0; --line-2:#cbd5e1;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
  --primary:#2a8574; --primary-2:#1f6659; --primary-ink:#ffffff; --primary-soft:#e5f2ef;
  --accent:#e38c35; --accent-2:#c9701c; --accent-soft:#fdf1e4;
  --danger:#d03b3b; --danger-soft:#fdecec; --warn:#a86a12; --warn-soft:#fdf5e3; --ok:#1c7f45; --ok-soft:#e5f5eb;
  --shadow:0 4px 6px -1px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 15px -3px rgba(42,133,116,.28);
  --l1:#d95926; --l2:#f0a07c; --l3:#d9d8d4; --l4:#7cc3b3; --l5:#2a8574;
  --l1-ink:#ffffff; --l2-ink:#3b1d0e; --l3-ink:#1f2937; --l4-ink:#0d2f28; --l5-ink:#ffffff;
  --lv-vlow:#d03b3b; --lv-low:#ec835a; --lv-mod:#9aa6b6; --lv-high:#4fae98; --lv-vhigh:#1f6659;
  --c1:#2a8574; --c2:#eb6834; --c3:#2a78d6; --c4:#eda100; --c5:#e87ba4; --c6:#4a3aa7; --c7:#e34948; --c8:#008300;
  --blob1:rgba(227,140,53,.13); --blob2:rgba(42,133,116,.12);
  --radius:14px;
  --font:"Cairo","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1413; --surface:#121c1b; --surface-2:#182523; --line:#243330; --line-2:#33443f;
    --ink:#e8f0ee; --ink-2:#c4d1ce; --muted:#8fa29e;
    --primary:#3fb89f; --primary-2:#2a8574; --primary-ink:#06201b; --primary-soft:#153a33;
    --accent:#f0a055; --accent-2:#f5b577; --accent-soft:#3a2917;
    --danger:#ef6b6b; --danger-soft:#3a1717; --warn:#f0b54a; --warn-soft:#352812; --ok:#4cc27d; --ok-soft:#12301f;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 15px -3px rgba(0,0,0,.45);
    --l1:#d95926; --l2:#b8704f; --l3:#4b504e; --l4:#3f8f7e; --l5:#7ad3bf;
    --l1-ink:#ffffff; --l2-ink:#ffffff; --l3-ink:#e8f0ee; --l4-ink:#ffffff; --l5-ink:#06201b;
    --lv-vlow:#e66767; --lv-low:#ec835a; --lv-mod:#7d8a99; --lv-high:#4fae98; --lv-vhigh:#7ad3bf;
    --c1:#3fb89f; --c2:#d95926; --c3:#3987e5; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#e66767; --c8:#2fa52f;
    --blob1:rgba(240,160,85,.07); --blob2:rgba(63,184,159,.08);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0c1413; --surface:#121c1b; --surface-2:#182523; --line:#243330; --line-2:#33443f;
    --ink:#e8f0ee; --ink-2:#c4d1ce; --muted:#8fa29e;
    --primary:#3fb89f; --primary-2:#2a8574; --primary-ink:#06201b; --primary-soft:#153a33;
    --accent:#f0a055; --accent-2:#f5b577; --accent-soft:#3a2917;
    --danger:#ef6b6b; --danger-soft:#3a1717; --warn:#f0b54a; --warn-soft:#352812; --ok:#4cc27d; --ok-soft:#12301f;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 15px -3px rgba(0,0,0,.45);
    --l1:#d95926; --l2:#b8704f; --l3:#4b504e; --l4:#3f8f7e; --l5:#7ad3bf;
    --l1-ink:#ffffff; --l2-ink:#ffffff; --l3-ink:#e8f0ee; --l4-ink:#ffffff; --l5-ink:#06201b;
    --lv-vlow:#e66767; --lv-low:#ec835a; --lv-mod:#7d8a99; --lv-high:#4fae98; --lv-vhigh:#7ad3bf;
    --c1:#3fb89f; --c2:#d95926; --c3:#3987e5; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#e66767; --c8:#2fa52f;
    --blob1:rgba(240,160,85,.07); --blob2:rgba(63,184,159,.08);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh;
  background:
    radial-gradient(600px 380px at 8% -4%, var(--blob1), transparent 70%),
    radial-gradient(640px 420px at 96% 6%, var(--blob2), transparent 70%),
    var(--bg);
  background-attachment:fixed;}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--ink);white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:-4px}
.logo{width:34px;height:34px;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--primary-soft);color:var(--primary-2)}
:root[data-theme="dark"] .tab[aria-current="page"]{color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-current="page"]{color:var(--primary)}}
.top-actions{display:flex;gap:8px;align-items:center}
@media (max-width:760px){.tabs{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.top-actions{margin-inline-start:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease;white-space:nowrap}
.btn:hover{border-color:var(--line-2);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#2a8574 0%,#1f6659 100%);color:#fff;border-color:transparent;box-shadow:var(--shadow-lg)}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}
.btn.accent{background:linear-gradient(135deg,#e38c35,#f5a855);color:#2b1606;border-color:transparent}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.icon{padding:6px;width:32px;height:32px;justify-content:center}
.btn svg{width:16px;height:16px;flex:none}
.lang-btn{font-weight:700}

main{padding-block:24px 64px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:26px;font-weight:800}
.page-head p{color:var(--muted);max-width:62ch}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent-2);letter-spacing:.06em;text-transform:uppercase}
:root[dir="rtl"] .eyebrow{letter-spacing:0}
.stack-v{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:18px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head p{color:var(--muted);font-size:13.5px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl-strong{font-weight:700;font-size:14px;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14.5px;color:var(--ink);transition:border-color .12s}
textarea.input{resize:vertical;min-height:70px;line-height:1.55}
.input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{inset-inline-start:19px}

.demo-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.demo-card.on{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));background:color-mix(in srgb,var(--primary-soft) 40%,var(--surface))}
.demo-card textarea{min-height:110px;font-size:13.5px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.teal{background:var(--primary-soft);color:var(--primary-2)}
.pill.orange{background:var(--accent-soft);color:var(--accent-2)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;white-space:nowrap}
.lv i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--ink-2);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:14px}
.banner.teal{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.banner.bad{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.banner svg{width:20px;height:20px;flex:none;margin-top:2px}
.banner b{color:var(--ink)}

/* question editor */
.sec-card{padding:0;overflow:hidden}
.sec-head{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-no{font-weight:800;color:var(--accent-2);font-size:13px;white-space:nowrap}
.sec-head .input{flex:1;min-width:180px;font-weight:700}
.q-list{display:flex;flex-direction:column}
.q-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.q-row:last-child{border-bottom:0}
.q-num{font-weight:800;color:var(--muted);font-size:13px;padding-top:8px;font-variant-numeric:tabular-nums}
.q-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.q-main .top-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-main select.input{width:auto;padding:6px 10px;font-size:13px}
.q-main textarea.input{min-height:44px}
.q-tools{display:flex;gap:4px}
.lint{display:flex;gap:6px;flex-wrap:wrap}
.q-add{padding:12px 16px}
@media (max-width:620px){.q-row{grid-template-columns:1fr}.q-num{padding-top:0}.q-tools{justify-content:flex-end}}

/* survey (respondent) */
.survey{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.survey-hero{text-align:start}
.survey-hero h1{font-size:28px;font-weight:800;margin-bottom:6px}
.progress{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.progress .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress .bar span{display:block;height:100%;background:linear-gradient(90deg,#2a8574,#3fb89f);border-radius:99px;transition:width .3s ease}
:root[dir="rtl"] .progress .bar span{background:linear-gradient(270deg,#2a8574,#3fb89f)}
fieldset.q{border:1px solid var(--line);border-radius:12px;padding:16px;margin:0;background:var(--surface);display:flex;flex-direction:column;gap:12px}
fieldset.q legend{float:left;width:100%;padding:0;font-weight:700;font-size:15.5px;color:var(--ink);display:flex;gap:8px;align-items:baseline}
:root[dir="rtl"] fieldset.q legend{float:right}
fieldset.q legend + *{clear:both}
.qn{font-size:12px;color:var(--accent-2);font-weight:800;flex:none}
.req{color:var(--danger)}
fieldset.q.has-err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.err-msg{display:none;color:var(--danger);font-size:13px;font-weight:600}
.has-err .err-msg{display:block}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lk{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3;transition:all .12s}
.lk:hover{border-color:var(--line-2);background:var(--surface-2)}
.lk input,.opt input{position:absolute;opacity:0;pointer-events:none}
.lk .num{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-weight:800;color:var(--ink-2);font-size:14px}
.lk:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--ink)}
.lk:has(input:checked) .num{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.lk:has(input:focus-visible),.opt:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
@media (max-width:560px){.likert{grid-template-columns:1fr}.lk{flex-direction:row;padding:9px 12px;text-align:start;font-size:14px}.lk .num{width:26px;height:26px;font-size:13px}}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.opt::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.opt:hover{background:var(--surface-2)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--ink)}
.opt:has(input:checked)::before{border-color:var(--primary);background:radial-gradient(circle,var(--primary) 45%,transparent 50%)}
.nav-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.thanks{text-align:center;padding:48px 24px}
.thanks .check{width:72px;height:72px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 16px}
.thanks .check svg{width:36px;height:36px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .k-l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .k-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chart-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.chart-card h3{font-size:14.5px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.hb .t span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--c1);min-width:2px}
:root[dir="rtl"] .hb .t span{border-radius:4px 0 0 4px}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600;white-space:nowrap}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut-wrap canvas{width:130px;height:130px;flex:none}
.legend{display:flex;flex-direction:column;gap:5px;font-size:13px;flex:1;min-width:140px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
.sbars{display:flex;flex-direction:column;gap:12px}
.sb{display:grid;grid-template-columns:minmax(110px,30%) 1fr 150px;gap:12px;align-items:center}
.sb .l{font-weight:600;font-size:14px}
.sb .t{position:relative;height:20px;background:var(--surface-2);border-radius:4px}
.sb .t span{position:absolute;inset-block:0;inset-inline-start:0;border-radius:0 4px 4px 0}
:root[dir="rtl"] .sb .t span{border-radius:4px 0 0 4px}
.sb .t em{position:absolute;inset-block:-3px;width:1px;background:var(--line-2)}
.sb .v{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:620px){.sb{grid-template-columns:1fr;gap:4px}.hb{grid-template-columns:1fr auto;}.hb .t{grid-column:1/-1;grid-row:2}}
.scale-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.stackbar{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface)}
.stackbar span{display:grid;place-items:center;font-size:11px;font-weight:700;min-width:0;overflow:hidden}
.item-res{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item-res:last-child{border-bottom:0}
.item-res .qtext{font-size:14px;font-weight:600}
.item-res .stats{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.item-res .stats b{color:var(--ink-2)}
@media (max-width:760px){.item-res{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{background:var(--surface-2);font-weight:700;color:var(--ink-2);font-size:12.5px}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:center}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tfoot td{background:var(--surface-2);font-size:12.5px}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ins-list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ins-list li::marker{color:var(--accent-2);font-weight:700}
.rec{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.theme-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:3px}
.theme-item .th{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.theme-item q{color:var(--muted);font-size:13px}
.answers{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.answers div{padding:8px 12px;background:var(--surface-2);border-radius:8px}
.empty{text-align:center;padding:48px 20px}
.empty h2{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);max-width:52ch;margin:0 auto 18px}
.sec-title-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sec-title-row h3{font-size:16px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);gap:12px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-inline-end-color:transparent;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}*{transition:none!important}}

/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal.wide{max-width:900px}
.modal h3{font-size:18px}
.modal .row{justify-content:flex-end}
.preview-pages{display:flex;flex-direction:column;gap:12px}
.preview-pages img{border:1px solid var(--line);border-radius:6px;width:100%}
.toast{position:fixed;inset-inline-start:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
:root[dir="rtl"] .toast{transform:translateX(50%)}
.save-state{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

/* report (always light, rendered off-screen for PDF) */
#report-root{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none;z-index:-1}
.rp{width:794px;height:1123px;background:#ffffff;color:#0f172a;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;position:relative;overflow:hidden;letter-spacing:0}
.rp-head{height:54px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #2a8574;font-size:11px;color:#64748b}
.rp-head b{color:#1f6659;font-size:12px}
.rp-body{position:absolute;top:74px;bottom:62px;left:56px;right:56px;overflow:hidden;display:flex;flex-direction:column;gap:14px;font-size:12.5px;line-height:1.6}
.rp-foot{position:absolute;bottom:0;left:0;right:0;height:46px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:#94a3b8;border-top:1px solid #e2e8f0}
.rp h2{font-size:20px;color:#1f6659;font-weight:800;border-bottom:1px solid #e2e8f0;padding-bottom:6px;margin-top:4px}
.rp h3{font-size:14.5px;color:#0f172a;font-weight:700}
.rp p{color:#334155}
.rp table{width:100%;border-collapse:collapse;font-size:11.5px}
.rp th,.rp td{padding:5px 8px;border-bottom:1px solid #e2e8f0;text-align:start;vertical-align:top}
.rp th{background:#f1f5f4;color:#1f2937;font-weight:700}
.rp td.n,.rp th.n{text-align:center;white-space:nowrap}
.rp ul,.rp ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:5px;color:#334155}
.rp .kp{display:flex;gap:10px}
.rp .kp div{flex:1;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;background:#f8fafc}
.rp .kp small{display:block;color:#64748b;font-size:10.5px}
.rp .kp strong{font-size:20px;color:#0f172a}
.rp .rb{display:grid;grid-template-columns:36% 1fr 90px;gap:8px;align-items:center;font-size:11.5px;margin-bottom:4px}
.rp .rb .t{height:11px;background:#eef2f4;border-radius:3px;overflow:hidden}
.rp .rb .t span{display:block;height:100%;background:#2a8574}
.rp .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.rp .box{border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;background:#fbfcfc}
.rp .demo-flag{display:inline-block;background:#fdf1e4;color:#9a5412;border-radius:6px;padding:2px 8px;font-weight:700;font-size:11px}
.rp.cover{background:linear-gradient(160deg,#ffffff 0%,#f4faf8 60%,#fdf4ea 100%)}
.rp.cover .cv{position:absolute;inset:0;padding:90px 70px;display:flex;flex-direction:column}
.rp.cover .band{height:10px;background:linear-gradient(90deg,#2a8574,#3fb89f 60%,#e38c35)}
.rp.cover h1{font-size:36px;font-weight:800;line-height:1.25;color:#0f172a;margin:26px 0 10px}
.rp.cover .sub{font-size:16px;color:#2a8574;font-weight:700}
.rp.cover .meta{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rp.cover .meta div{border-top:2px solid #2a8574;padding-top:8px}
.rp.cover .meta small{display:block;color:#64748b;font-size:11px}
.rp.cover .meta strong{font-size:18px}
.rp .stk{display:flex;height:12px;border-radius:3px;overflow:hidden;gap:1px}

/* standalone (GitHub Pages) additions */
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--primary)}
a.btn{text-decoration:none}
.brand{text-decoration:none}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;padding-block:36px 12px}
.hero h1{font-size:40px;font-weight:800;line-height:1.2;margin-bottom:12px}
.hero h1 span{color:var(--primary)}
.hero p{color:var(--ink-2);font-size:16.5px;max-width:52ch}
.hero .row{margin-top:22px}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:28px}
.feat .card h3{font-size:15.5px;margin-bottom:4px}
.feat .card p{color:var(--muted);font-size:13.5px}
.feat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px;color:#fff}
.feat .ic svg{width:20px;height:20px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero h1{font-size:30px}}
.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.s-card{display:flex;flex-direction:column;gap:10px}
.s-card h3{font-size:16.5px;overflow-wrap:anywhere}
.s-card .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.s-card .row{margin-top:auto}
.crumb{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted);text-decoration:none;font-weight:600}
.crumb a:hover{color:var(--primary)}
.share-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:start}
@media (max-width:720px){.share-grid{grid-template-columns:1fr}}
.link-box{display:flex;gap:8px}
.link-box input{font-family:ui-monospace,Consolas,monospace;font-size:13px;direction:ltr}
.qr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.qr #qr-box{width:200px;height:200px}
.qr #qr-box img,.qr #qr-box canvas{width:200px!important;height:200px!important}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--primary-soft);display:grid;place-items:center;font-weight:800;color:var(--primary-2);font-size:13px}
.user-chip{display:flex;align-items:center;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.footer{padding-block:24px 36px;color:var(--muted);font-size:12.5px;text-align:center}

const Store = {
  auth:null, db:null, subs:[], mineUnsub:null,
  async init(){
    const cfg = CFG.firebase;
    if (cfg && cfg.apiKey && window.firebase) {
      try { firebase.initializeApp(cfg); this.auth = firebase.auth(); this.db = firebase.firestore(); S.mode = 'cloud'; }
      catch(e){ console.error(e); S.mode = 'local'; }
    }
    if (S.mode === 'cloud') {
      try { await this.auth.getRedirectResult(); } catch(e){ if (e && e.code) toast(t('signInFailed')); }
      await new Promise(res => { let first = true;
        this.auth.onAuthStateChanged(u => {
          S.user = u && !u.isAnonymous ? { uid:u.uid, name:u.displayName || '', email:u.email || '', photo:u.photoURL || '' } : null;
          if (first) { first = false; res(); } else onAuth();
        }); });
    } else {
      const id = lsGet('istb.uid') || ('local' + newId()); lsSet('istb.uid', id); S.user = { uid:id, local:true, name:'' };
    }
  },
  async signIn(){ const p = new firebase.auth.GoogleAuthProvider();
    try { await this.auth.signInWithPopup(p); }
    catch(e){ const c = e && e.code;
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') return this.auth.signInWithRedirect(p);
      if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request') { console.error(e); toast(t('signInFailed') + (c ? ' (' + c + ')' : ''), 7000); } } },
  signOut(){ return this.auth.signOut(); },
  async respondentUid(){ if (S.mode === 'local') return S.user.uid; const u = this.auth.currentUser; if (u) return u.uid; const c = await this.auth.signInAnonymously(); return c.user.uid; },
  stop(){ this.subs.forEach(f => { try { f(); } catch(e){} }); this.subs = []; clearTimeout(this._timer); },
  // ---- creator: list of my questionnaires
  watchMine(){
    if (this.mineUnsub) { this.mineUnsub(); this.mineUnsub = null; }
    if (S.mode === 'local') { const all = lsJSON('istb.surveys', {});
      S.mine = Object.keys(all).map(id => Object.assign({ id }, all[id]));
      S.mine.forEach(s => S.counts[s.id] = lsJSON('istb.resp.' + s.id, []).filter(r => r && r.status === 'complete').length); return; }
    if (!S.user) { S.mine = null; return; }
    S.mine = null;
    this.mineUnsub = this.db.collection('surveys').where('ownerUid', '==', S.user.uid).onSnapshot(snap => {
      S.mine = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      S.mine.forEach(s => { if (S.counts[s.id] == null) { S.counts[s.id] = '…';
        this.db.collection('surveys').doc(s.id).collection('responses').where('status', '==', 'complete').get()
          .then(q => { S.counts[s.id] = q.size; if (S.route.name === 'home') render(); }).catch(() => { S.counts[s.id] = '—'; }); } });
      if (S.route.name === 'home') render();
    }, e => { console.error(e); S.loadErr = t('loadFailed'); S.mine = []; if (S.route.name === 'home') render(); });
  },
  async create(sv){
    const id = newId(); const now = Date.now();
    const doc = Object.assign(JSON.parse(JSON.stringify(sv)), { ownerUid: S.user.uid, createdAt: now, updatedAt: now, by: TAB_ID });
    if (S.mode === 'local') { const all = lsJSON('istb.surveys', {}); all[id] = doc; lsSet('istb.surveys', JSON.stringify(all)); }
    else await this.db.collection('surveys').doc(id).set(doc);
    return id;
  },
  async remove(id){
    if (S.mode === 'local') { const all = lsJSON('istb.surveys', {}); delete all[id]; lsSet('istb.surveys', JSON.stringify(all)); lsDel('istb.resp.' + id); lsDel('istb.ins.' + id); this.watchMine(); return; }
    const ref = this.db.collection('surveys').doc(id);
    const rs = await ref.collection('responses').get();
    for (let i = 0; i < rs.docs.length; i += 400) { const b = this.db.batch(); rs.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
    try { await ref.collection('private').doc('insights').delete(); } catch(e){}
    await ref.delete();
  },
  // ---- creator: one questionnaire, live
  open(id){
    this.stop(); S.survey = null; S.responses = []; S.insights = {}; S.loadErr = null; S.readOnly = false; S.take = null; invalidate();
    if (S.mode === 'local') {
      const all = lsJSON('istb.surveys', {}); S.survey = all[id] || null; if (!S.survey) S.loadErr = t('notFound');
      S.responses = lsJSON('istb.resp.' + id, []); S.insights = { live: lsJSON('istb.ins.' + id, null) }; return;
    }
    const ref = this.db.collection('surveys').doc(id); let first = true;
    this.subs.push(ref.onSnapshot(snap => {
      if (!snap.exists) { S.survey = null; S.loadErr = t('notFound'); render(); return; }
      const d = snap.data(); if (!first && d.by === TAB_ID) return;
      const clone = JSON.parse(JSON.stringify(d));
      const ae = document.activeElement;
      if (!first && ae && ae.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) { S.pendingRemote = clone; return; }
      first = false; S.survey = clone; invalidate(); render();
    }, e => { S.loadErr = e && e.code === 'permission-denied' ? t('permDenied') : t('loadFailed'); render(); }));
    this.subs.push(ref.collection('responses').onSnapshot(snap => {
      S.responses = snap.docs.map(d => d.data()); invalidate();
      if (S.tab === 'results' || S.tab === 'share') render();
    }, e => console.error(e)));
    this.subs.push(ref.collection('private').doc('insights').onSnapshot(snap => {
      if (!snap.exists) return; const d = snap.data();

/* ---------------- statistics ---------------- */
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const sd = a => { if (a.length < 2) return NaN; const m = mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1)); };
const variance = a => { const s = sd(a); return s*s; };
function level(m){ if (!isFinite(m)) return null; if (m <= 1.8) return 'vlow'; if (m <= 2.6) return 'low'; if (m <= 3.4) return 'mod'; if (m <= 4.2) return 'high'; return 'vhigh'; }
const LEVELS = [['vlow','1.00 – 1.80'],['low','1.81 – 2.60'],['mod','2.61 – 3.40'],['high','3.41 – 4.20'],['vhigh','4.21 – 5.00']];
function alphaLabel(a){ if (!isFinite(a)) return ''; if (a >= .9) return 'al_ex'; if (a >= .8) return 'al_good'; if (a >= .7) return 'al_acc'; if (a >= .6) return 'al_q'; return 'al_poor'; }
const ALPHA_MIN = 10;
function lgamma(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5]; let y=x, tmp=x+5.5; tmp-=(x+0.5)*Math.log(tmp); let ser=1.000000000190015; for (let j=0;j<6;j++) ser+=c[j]/++y; return -tmp+Math.log(2.5066282746310005*ser/x); }
function betacf(a,b,x){ const FP=1e-300; const qab=a+b,qap=a+1,qam=a-1; let c=1,d=1-qab*x/qap; if(Math.abs(d)<FP)d=FP; d=1/d; let h=d;

    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<3e-12) break; } return h; }

function fmtP(p){ if (p == null) return '—'; return p < .001 ? '< .001' : p.toFixed(3).replace(/^0/, ''); }

function analyze(sv, responses){
  const complete = responses.filter(r => r && r.status === 'complete' && r.answers);
  const A = { sv, n: complete.length, started: responses.length, complete, items:{}, sections:[], demo:{}, overall:null };
  A.completion = pct(A.n, A.started);
  const durs = complete.filter(r => r.startedAt && r.submittedAt).map(r => (r.submittedAt - r.startedAt)/60000).filter(x => x > 0 && x < 240).sort((a,b)=>a-b);
  A.medianMin = durs.length ? durs[Math.floor(durs.length/2)] : null;
  const times = complete.map(r => r.submittedAt).filter(Boolean).sort((a,b)=>a-b);
  A.period = times.length ? [times[0], times[times.length-1]] : null;
  // demographics
  demoGroupFields(sv).forEach(k => { const opts = demoOpts(k, sv); const c = opts.map(()=>0); let n=0;
    complete.forEach(r => { const v = r.demo && r.demo[k]; if (Number.isInteger(v) && v >= 0 && v < opts.length) { c[v]++; n++; } });
    A.demo[k] = { opts, counts:c, n }; });
  // items
  let qn = 0;
  sv.sections.forEach(sec => sec.items.forEach(q => { qn++;
    const it = { q, no: qn, sec };
    if (q.type === 'likert') { const vals = []; const c=[0,0,0,0,0];
      complete.forEach(r => { const v = Number(r.answers[q.id]); if (v>=1 && v<=5 && Number.isInteger(v)) { vals.push(v); c[v-1]++; } });
      Object.assign(it, { vals, counts:c, n: vals.length, mean: mean(vals), sd: sd(vals) }); it.level = level(it.mean);
    } else if (q.type === 'mc' || q.type === 'yesno') { const opts = q.type === 'yesno' ? [t('yes'), t('no')] : (q.opts || []); const c = opts.map(()=>0); let n=0;
      complete.forEach(r => { let v = r.answers[q.id]; if (q.type === 'yesno') v = v === 1 ? 0 : v === 0 ? 1 : null; if (Number.isInteger(v) && v>=0 && v<opts.length) { c[v]++; n++; } });
      Object.assign(it, { opts, counts:c, n });
    } else { const ans = []; complete.forEach(r => { const v = r.answers[q.id]; if (typeof v === 'string' && v.trim()) ans.push(v.trim().slice(0, 1000)); }); Object.assign(it, { answers: ans, n: ans.length }); }
    A.items[q.id] = it; }));
  // sections
  const personAll = complete.map(() => []);
  sv.sections.forEach(sec => { const lk = sec.items.filter(q => q.type === 'likert'); if (!lk.length) return;
    const scores = []; const byResp = [];
    complete.forEach((r, ri) => { const v = lk.map(q => Number(r.answers[q.id])).filter(x => x>=1 && x<=5); if (v.length) { const m = mean(v); scores.push(m); byResp.push({ r, m }); personAll[ri].push(...v); } });
    let alpha = null, alphaN = 0;
    if (lk.length >= 2) { const rows = complete.map(r => lk.map(q => Number(r.answers[q.id]))).filter(row => row.every(x => x>=1 && x<=5)); alphaN = rows.length;
      if (rows.length >= ALPHA_MIN) { const k = lk.length; const iv = lk.map((_,j) => variance(rows.map(r => r[j]))); const tv = variance(rows.map(r => r.reduce((a,b)=>a+b,0)));
        alpha = tv > 0 ? (k/(k-1))*(1 - iv.reduce((a,b)=>a+b,0)/tv) : null; } }
    A.sections.push({ sec, items: lk, scores, byResp, n: scores.length, mean: mean(scores), sd: sd(scores), level: level(mean(scores)), alpha, alphaN });
  });
  const pm = personAll.filter(a => a.length).map(mean);
  A.overall = { mean: mean(pm), sd: sd(pm), level: level(mean(pm)), k: A.sections.reduce((s,x)=>s+x.items.length,0) };
  // cross-tab for each group field
  A.cross = {};
  demoGroupFields(sv).forEach(f => { const opts = demoOpts(f, sv);
    A.cross[f] = A.sections.map(s => { const groups = opts.map(() => []);
      s.byResp.forEach(({r, m}) => { const g = r.demo && r.demo[f]; if (Number.isInteger(g) && g>=0 && g<opts.length) groups[g].push(m); });
      return { groups: groups.map((g,i) => ({ label: opts[i], n: g.length, mean: mean(g) })), test: anova(groups) }; }); });
  return A;
}

const DEMO_W = { gender:[.55,.45], nationality:[.7,.2,.1], age:[.18,.3,.24,.15,.09,.04], marital:[.35,.55,.06,.04], income:[.2,.28,.22,.13,.1,.07], region:[.32,.22,.24,.1,.12], education:[.12,.18,.45,.2,.05] };
let demoCache = { key:null, data:null };
function demoData(){

  for (let i=0;i<N;i++){
    const demo = {};
    demoGroupFields(sv).forEach(k => { const n = demoOpts(k).length; let w = DEMO_W[k]; if (!w || w.length !== n) w = Array.from({length:n},(_,j)=>1/(1+j*0.35)); demo[k] = pick(w); });
    const trait = norm()*0.45; const answers = {};
    let si = 0, openIdx = 0;
    sv.sections.forEach(sec => { const lk = sec.items.some(q => q.type === 'likert'); let base = BASE[si % BASE.length] + trait + norm()*0.3;
      if (lk) { const g = demo.gender, a = demo.age, e = demo.education, rg = demo.region;
        if (si % 4 === 0 && a != null) base -= 0.2*Math.max(0, a-2);
        if (si % 4 === 3 && g === 1) base += 0.35;
        if (si % 4 === 2 && e != null) base += 0.12*e - 0.2;
        if (si % 4 === 1 && rg === 3) base -= 0.55; if (si % 4 === 1 && rg === 4) base -= 0.3;
        si++; }

        else if (q.type === 'mc') { const n = (q.opts||[]).length; if (n) answers[q.id] = pick(Array.from({length:n},(_,j)=>1/(1+j*0.6))); }
        else if (q.type === 'yesno') answers[q.id] = R() < 0.34 ? 1 : 0;

}

const qShort = s => { s = String(s||''); return s.length > 90 ? s.slice(0, 87) + '…' : s; };
const fieldName = f => t('d_' + f);
function sigDiffs(A){ const out = [];

    if (gs.length >= 2) out.push({ f, s: A.sections[si], test: c.test, hi: gs[0], lo: gs[gs.length-1] }); } }));
  return out.sort((a,b) => a.test.p - b.test.p); }
function ruleInsights(A){
  const secs = A.sections.filter(s => isFinite(s.mean)); const sorted = secs.slice().sort((a,b)=>b.mean-a.mean);
  const lv = x => t('lv_' + x); const F = [], C = [], R = [], L = [], FR = [];
  const likertItems = Object.values(A.items).filter(i => i.q.type === 'likert' && i.n).sort((a,b)=>b.mean-a.mean);
  if (secs.length) F.push(t('f_overall', { m: fmt(A.overall.mean), lv: lv(A.overall.level), k: A.overall.k, n: A.n }));
  if (sorted.length > 1) { F.push(t('f_high', { s: sorted[0].sec.title, m: fmt(sorted[0].mean), lv: lv(sorted[0].level) })); const lo = sorted[sorted.length-1]; F.push(t('f_low', { s: lo.sec.title, m: fmt(lo.mean), lv: lv(lo.level) })); }
  if (likertItems.length > 1) { const a = likertItems[0], b = likertItems[likertItems.length-1]; F.push(t('f_items', { q1: qShort(a.q.text), m1: fmt(a.mean), q2: qShort(b.q.text), m2: fmt(b.mean) })); }
  const sd = sigDiffs(A);
  sd.slice(0, 3).forEach(d => F.push(t('f_sig', { s: d.s.sec.title, f: fieldName(d.f), F: fmt(d.test.F), p: fmtP(d.test.p), g1: d.hi.label, m1: fmt(d.hi.mean), g2: d.lo.label, m2: fmt(d.lo.mean) })));
  if (!sd.length && Object.keys(A.cross).length && A.n >= 10) F.push(t('f_nosig'));
  Object.values(A.items).forEach(i => { if (!i.n) return;
    if (i.q.type === 'yesno') F.push(t('f_yes', { p: fmt(pct(i.counts[0], i.n), 1), q: qShort(i.q.text) }));
    if (i.q.type === 'mc') { const mx = i.counts.indexOf(Math.max(...i.counts)); F.push(t('f_mc', { q: qShort(i.q.text), o: i.opts[mx], p: fmt(pct(i.counts[mx], i.n), 1) })); } });

  weak.forEach(s => { C.push({ title: t('c_sec_t', { s: s.sec.title }), evidence: t('c_sec_e', { m: fmt(s.mean), lv: lv(s.level), r: sorted.indexOf(s)+1, k: sorted.length }) });
    R.push({ action: t('r_sec', { s: s.sec.title }), challenge: t('c_sec_t', { s: s.sec.title }), priority: 'high', timeframe: t('tf_short') }); });
  if (!weak.length && asc.length) { const s = asc[0]; C.push({ title: t('c_rel_t', { s: s.sec.title }), evidence: t('c_rel_e', { m: fmt(s.mean), lv: lv(s.level) }) });
    R.push({ action: t('r_sec', { s: s.sec.title }), challenge: t('c_rel_t', { s: s.sec.title }), priority: 'medium', timeframe: t('tf_mid') }); }
  likertItems.filter(i => i.mean < 3).slice(-3).reverse().forEach(i => { const dis = pct(i.counts[0] + i.counts[1], i.n);
    const title = t('c_item_t', { q: qShort(i.q.text) }); C.push({ title, evidence: t('c_item_e', { m: fmt(i.mean), p: fmt(dis, 1) }) });
    R.push({ action: t('r_item', { q: qShort(i.q.text) }), challenge: title, priority: i.mean < 2.6 ? 'high' : 'medium', timeframe: t('tf_short') }); });
  sd.slice(0, 2).forEach(d => { const title = t('c_gap_t', { f: fieldName(d.f), s: d.s.sec.title });
    C.push({ title, evidence: t('c_gap_e', { g2: d.lo.label, m2: fmt(d.lo.mean), g1: d.hi.label, m1: fmt(d.hi.mean), F: fmt(d.test.F), p: fmtP(d.test.p) }) });
    R.push({ action: t('r_gap', { s: d.s.sec.title, g: d.lo.label }), challenge: title, priority: 'medium', timeframe: t('tf_mid') }); });

  // limitations
  if (A.src === 'demo') L.push(t('l_demo'));

const STOP = new Set(('the a an and or of to in on for with is are was were be been it this that my i me we our you your at as by from not no do does did can could would should will have has had too very more most so if but than then there their they them what which when how who all any some one ' +

function keywords(answers){ const c = {}; answers.forEach(a => { const seen = new Set(); a.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).forEach(w => { if (w.length < 3 || STOP.has(w) || seen.has(w)) return; seen.add(w); c[w] = (c[w]||0)+1; }); });

// Calls Claude with the creator's own Anthropic API key (kept in this browser only).
const AI_MODEL = 'claude-opus-5';
let AnthropicSDK = null;
const aiKey = () => lsGet('istb.apikey') || '';
function aiErrText(e){ const c = e && e.code;
  if (c === 'no_key') return t('aiNeedKey'); if (c === 'bad_key') return t('aiErr_key'); if (c === 'refused') return t('aiErr_refused');
  if (c === 'rate_limited') return t('aiErr_rate'); if (c === 'invalid_json') return t('aiErr_json'); return t('aiErr_generic'); }
function parseJSONLoose(text){
  try { return JSON.parse(text); } catch(e){}
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) { try { return JSON.parse(m[1]); } catch(e){} }
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
  if (a >= 0 && b > a) { try { return JSON.parse(text.slice(a, b + 1)); } catch(e){} }
  throw { code:'invalid_json' };
}
async function aiJSON(prompt, busyMsg){
  const key = aiKey(); if (!key) throw { code:'no_key' };
  const ctl = new AbortController();
  S.busy = { msg: busyMsg || t('aiThinking'), ctl }; renderModal();
  try {
    if (!AnthropicSDK) { try { AnthropicSDK = (await import('https://esm.sh/@anthropic-ai/sdk')).default; } catch(e){ console.error(e); throw { code:'upstream_error' }; } }
    const client = new AnthropicSDK({ apiKey: key, dangerouslyAllowBrowser: true });
    const stream = client.beta.messages.stream({
      model: AI_MODEL,
      max_tokens: 32000,
      thinking: { type: 'adaptive' },
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      system: 'You produce machine-readable JSON for a survey research application. Reply with one JSON value and no other text.',
      messages: [{ role: 'user', content: prompt }]
    }, { signal: ctl.signal });
    stream.on('text', () => { if (S.busy && S.busy.ctl === ctl && S.busy.msg !== t('aiWriting')) { S.busy.msg = t('aiWriting'); renderModal(); } });
    const msg = await stream.finalMessage();
    if (msg.stop_reason === 'refusal') throw { code:'refused' };
    if (msg.stop_reason === 'max_tokens') throw { code:'invalid_json' };
    return parseJSONLoose(msg.content.filter(b => b.type === 'text').map(b => b.text).join(''));
  } catch(e) {
    if (ctl.signal.aborted || (AnthropicSDK && e instanceof AnthropicSDK.APIUserAbortError)) throw { code:'cancelled' };
    if (e && typeof e.code === 'string' && !(AnthropicSDK && e instanceof AnthropicSDK.APIError)) throw e;
    if (AnthropicSDK) {
      if (e instanceof AnthropicSDK.AuthenticationError || e instanceof AnthropicSDK.PermissionDeniedError) throw { code:'bad_key' };
      if (e instanceof AnthropicSDK.RateLimitError) throw { code:'rate_limited' };
      if (e instanceof AnthropicSDK.APIError && e.status === 529) throw { code:'rate_limited' };
    }
    console.error(e); throw { code:'upstream_error' };
  } finally { if (S.busy && S.busy.ctl === ctl) { S.busy = null; renderModal(); } }
}

function compactStats(A){

  const lowest = items.slice(0, 5).map(i => ({ item: i.q.text, mean: +fmt(i.mean), disagreePct: +fmt(pct(i.counts[0]+i.counts[1], i.n),1) }));
  const highest = items.slice(-4).reverse().map(i => ({ item: i.q.text, mean: +fmt(i.mean) }));
  const demo = {}; Object.keys(A.demo).forEach(f => { const d = A.demo[f]; demo[T.en['d_'+f]] = d.opts.map((o,i) => `${o}: ${fmt(pct(d.counts[i], d.n),1)}%`).join('; '); });
  const diffs = sigDiffs(A).slice(0, 6).map(d => ({ section: d.s.sec.title, by: T.en['d_'+d.f], F: +fmt(d.test.F), p: +d.test.p.toFixed(4), highest: `${d.hi.label} (${fmt(d.hi.mean)})`, lowest: `${d.lo.label} (${fmt(d.lo.mean)})` }));
  const other = Object.values(A.items).filter(i => (i.q.type === 'mc' || i.q.type === 'yesno') && i.n).map(i => ({ question: i.q.text, results: i.opts.map((o,j) => `${o}: ${fmt(pct(i.counts[j], i.n),1)}%`).join('; ') }));
  const themes = Object.values(A.items).filter(i => i.q.type === 'open').map(i => { const th = themesFor(A, i.q.id); return { question: i.q.text, themes: th ? th.themes.map(x => `${x.theme} (${x.count})`) : keywords(i.answers).slice(0,6).map(k => k[0]) }; });
  return { title: S.survey.title, topic: (S.survey.summary||'').slice(0, 1200), dataIsDemo: A.src === 'demo', completeResponses: A.n, started: A.started, completionRatePct: A.completion,
    overallMean: +fmt(A.overall.mean), scale: 'Likert 1–5; levels: 1–1.80 very low, 1.81–2.60 low, 2.61–3.40 moderate, 3.41–4.20 high, 4.21–5 very high', sections: secs, lowestItems: lowest, highestItems: highest, demographics: demo, significantGroupDifferences: diffs, otherQuestions: other, openEndedThemes: themes };
}

      else if (q.type === 'yesno') ctl = `<div class="opts">${[[1,'yes'],[0,'no']].map(([val,l]) => `<label class="opt"><input type="radio" name="a-${q.id}" value="${val}" data-ans="${q.id}" ${v===val?'checked':''}>${t(l)}</label>`).join('')}</div>`;

      ${last ? `<button class="btn primary" data-act="take-submit" ${tk.submitting?'disabled':''}>${tk.submitting ? `<span class="spin"></span>${t('submitting')}` : `${I.send}${t('submit')}`}</button>` : `<button class="btn primary" data-act="take-next">${t('next')}</button>`}</div>

function validateStep(){ const tk = S.take; const cur = takeSteps()[tk.step]; tk.errors = {}; const sv = S.survey;
  if (cur.kind === 'demo') demoOn().forEach(k => { if (k === 'name') { if (sv.demographics.name.anon === false && !(tk.demo.name||'').trim()) tk.errors.d_name = 1; } else if (!Number.isInteger(tk.demo[k])) tk.errors['d_'+k] = 1; });
  else sv.sections[cur.i].items.forEach(q => { if (!q.req) return; const v = tk.ans[q.id]; if (q.type === 'open' ? !(v||'').trim() : !Number.isInteger(v)) tk.errors[q.id] = 1; });
  return !Object.keys(tk.errors).length; }
async function startTake(){ const tk = S.take; tk.step = 0; tk.startedAt = tk.startedAt || Date.now(); saveDraft();
  if (!tk.already) { const rec = { id: S.mode === 'local' ? (tk.localId = tk.localId || uid('r')) : null, status:'started', startedAt: tk.startedAt, submittedAt:null, demo:{}, answers:{}, svAt: S.survey.updatedAt||0 };
    Store.writeResponse(rec).catch(e => console.error(e)); }
  render(); window.scrollTo({ top: 0 }); }
async function submitTake(){ const tk = S.take; if (!validateStep()) { render(); focusFirstError(); return; }
  tk.submitting = true; tk.err = null; render();
  const demo = {}; demoOn().forEach(k => { if (k === 'name') { const n = (tk.demo.name||'').trim(); if (n) demo.name = n.slice(0, 120); } else demo[k] = tk.demo[k]; });
  const answers = {}; S.survey.sections.forEach(s => s.items.forEach(q => { const v = tk.ans[q.id]; if (v === undefined || v === '') return; answers[q.id] = typeof v === 'string' ? v.slice(0, 2000) : v; }));
  const rec = { id: S.mode === 'local' ? (tk.localId || uid('r')) : null, status:'complete', startedAt: tk.startedAt || Date.now(), submittedAt: Date.now(), demo, answers, svAt: S.survey.updatedAt||0 };
  try { await Store.writeResponse(rec); tk.done = true; lsDel('istb.draft.' + S.route.id); }
  catch(e){ console.error(e); tk.err = t('submitFailed'); }
  tk.submitting = false; render(); window.scrollTo({ top: 0 }); }
function focusFirstError(){ const el = document.querySelector('.has-err'); if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); const i = el.querySelector('input,textarea'); if (i) setTimeout(() => i.focus({ preventScroll:true }), 300); } toast(t('fixErrors')); }

/* ---------------- charts ---------------- */
const CAT = ['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function hbars(labels, counts, n, color){ const mx = Math.max(1, ...counts);
  return `<div class="hbars">${labels.map((l, i) => `<div class="hb" title="${esc(l)}: ${counts[i]} (${fmt(pct(counts[i], n),1)}%)"><span class="l">${esc(l)}</span><span class="t"><span style="width:${counts[i]/mx*100}%;background:${color||'var(--c1)'}"></span></span><span class="v">${counts[i]} · ${fmt(pct(counts[i], n),1)}%</span></div>`).join('')}</div>`; }
function donut(labels, counts, n){ const data = JSON.stringify(counts);
  return `<div class="donut-wrap"><canvas width="260" height="260" data-donut='${data}' role="img" aria-label="${esc(labels.map((l,i)=>l+' '+fmt(pct(counts[i],n),1)+'%').join(', '))}"></canvas><div class="legend">${labels.map((l, i) => `<div><i style="background:var(${CAT[i%8]})"></i><span>${esc(l)}</span><b>${fmt(pct(counts[i], n),1)}%</b></div>`).join('')}</div></div>`; }
function drawDonuts(root, fixedColors){ (root || document).querySelectorAll('canvas[data-donut]').forEach(cv => { let counts; try { counts = JSON.parse(cv.dataset.donut); } catch(e){ return; }
  const ctx = cv.getContext('2d'); const W = cv.width, c = W/2, r = W/2 - 4, ir = r*0.6; ctx.clearRect(0,0,W,W);
  const tot = counts.reduce((a,b)=>a+b,0); const surface = fixedColors ? '#ffffff' : (cssVar('--surface') || '#fff');
  if (!tot) { ctx.fillStyle = fixedColors ? '#eef2f4' : cssVar('--surface-2'); ctx.beginPath(); ctx.arc(c,c,r,0,Math.PI*2); ctx.arc(c,c,ir,0,Math.PI*2,true); ctx.fill(); return; }
  let a = -Math.PI/2; counts.forEach((v, i) => { if (!v) return; const da = v/tot*Math.PI*2; ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,r,a,a+da); ctx.closePath(); ctx.fillStyle = fixedColors ? fixedColors[i%8] : cssVar(CAT[i%8]); ctx.fill(); a += da; });
  ctx.strokeStyle = surface; ctx.lineWidth = 4; a = -Math.PI/2; if (counts.filter(Boolean).length > 1) counts.forEach(v => { if (!v) return; ctx.beginPath(); ctx.moveTo(c,c); ctx.lineTo(c + r*Math.cos(a), c + r*Math.sin(a)); ctx.stroke(); a += v/tot*Math.PI*2; });
  ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(c,c,ir,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }); }
function stackbar(counts, n){ return `<div class="stackbar" role="img" aria-label="${[1,2,3,4,5].map(k => t('lk'+k)+' '+fmt(pct(counts[k-1],n),0)+'%').join(', ')}">${counts.map((c, i) => { const p = pct(c, n); return p > 0 ? `<span style="width:${p}%;background:var(--l${i+1});color:var(--l${i+1}-ink)" title="${t('lk'+(i+1))}: ${c} (${fmt(p,1)}%)">${p >= 9 ? Math.round(p)+'%' : ''}</span>` : ''; }).join('')}</div>`; }
function likertLegend(){ return `<div class="scale-legend">${[1,2,3,4,5].map(k => `<span class="lv"><i style="background:var(--l${k})"></i>${t('lk'+k)}</span>`).join('')}</div>`; }

  if (src === 'live' && liveN === 0) return head + `<div class="card empty"><h2>${t('noResp')}</h2><p>${t('noRespBody')}</p><button class="btn primary" data-act="src" data-src="demo">${t('previewDemo')}</button></div>`;
  const A = getA(); const ins = insightsFor(A);
  const kpis = `<div class="kpis">

    <div class="kpi"><div class="k-l">${t('kCompletion')}</div><div class="k-v">${fmt(A.completion,1)}%</div><div class="k-s">${A.n} / ${A.started}</div></div>
    <div class="kpi"><div class="k-l">${t('kOverall')}</div><div class="k-v">${fmt(A.overall.mean)}</div><div class="k-s">${t('kOf5')} · ${lvChip(A.overall.level)}</div></div>
    <div class="kpi"><div class="k-l">${t('kTime')}</div><div class="k-v">${A.medianMin == null ? '—' : fmt(A.medianMin,1)}</div><div class="k-s">${t('kMinutes')}</div></div></div>`;
  const dem = Object.keys(A.demo).length ? `<section class="card"><div class="card-head"><div><h2>${t('demoProfile')}</h2><p>${t('demoProfileLead')}</p></div></div><div class="grid2">${Object.keys(A.demo).map(f => { const d = A.demo[f];
    return `<div class="chart-card"><h3><span>${t('d_'+f)}</span><span class="muted small">n = ${d.n}</span></h3>${d.opts.length <= 4 ? donut(d.opts, d.counts, d.n) : hbars(d.opts, d.counts, d.n)}</div>`; }).join('')}</div></section>` : '';
  const ticks = [1.8,2.6,3.4,4.2].map(x => `<em style="inset-inline-start:${x/5*100}%"></em>`).join('');
  const secs = A.sections.length ? `<section class="card"><div class="card-head"><div><h2>${t('secScores')}</h2><p>${t('secScoresLead')}</p></div></div>
    <div class="sbars">${A.sections.map(s => `<div class="sb" title="${esc(s.sec.title)}: ${fmt(s.mean)}"><span class="l">${esc(s.sec.title)}</span><span class="t">${ticks}<span style="width:${(s.mean||0)/5*100}%;background:var(--lv-${s.level||'mod'})"></span></span><span class="v">${fmt(s.mean)} ${lvChip(s.level)}</span></div>`).join('')}</div>
    <div class="scale-legend"><b>${t('scaleLabel')}</b>${LEVELS.map(([k,r]) => `<span class="lv"><i style="background:var(--lv-${k})"></i>${t('lv_'+k)} ${r}</span>`).join('')}</div>
    <div class="tbl-wrap" style="margin-top:16px"><table class="tbl"><thead><tr><th>${t('colSection')}</th><th class="num">${t('colItems')}</th><th class="num">${t('colN')}</th><th class="num">${t('colMean')}</th><th class="num">${t('colSD')}</th><th>${t('colLevel')}</th><th class="num">${t('colAlpha')}</th></tr></thead><tbody>
    ${A.sections.map(s => `<tr><td>${esc(s.sec.title)}</td><td class="num">${s.items.length}</td><td class="num">${s.n}</td><td class="num"><b>${fmt(s.mean)}</b></td><td class="num">${fmt(s.sd)}</td><td>${lvChip(s.level)}</td><td class="num">${s.items.length < 2 ? t('alphaNA') : s.alpha == null ? `<span class="muted small">${t('alphaNeed',{n:ALPHA_MIN})}</span>` : `${fmt(s.alpha)} <span class="pill ${s.alpha>=.7?'ok':s.alpha>=.6?'warn':'bad'}">${t(alphaLabel(s.alpha))}</span>`}</td></tr>`).join('')}
    </tbody></table></div></section>` : '';
  // cross
  const gf = Object.keys(A.cross); if (!S.cross || !gf.includes(S.cross)) S.cross = gf[0];
  let cross = '';
  if (A.sections.length) { if (!gf.length) cross = `<section class="card"><h2>${t('crossTitle')}</h2><p class="muted" style="margin-top:6px">${t('noCross')}</p></section>`;
  else { const ct = A.cross[S.cross]; const groups = ct[0].groups;
    cross = `<section class="card"><div class="card-head"><div><h2>${t('crossTitle')}</h2><p>${t('crossLead')}</p></div>
      <div class="field" style="min-width:200px"><label for="cross-field">${t('compareBy')}</label><select class="input" id="cross-field" data-cross>${gf.map(f => `<option value="${f}" ${f===S.cross?'selected':''}>${t('d_'+f)}</option>`).join('')}</select></div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('colGroup')}</th><th class="num">${t('colN')}</th>${A.sections.map(s => `<th class="num">${esc(s.sec.title)}</th>`).join('')}</tr></thead><tbody>
      ${groups.map((g, gi) => `<tr><td>${esc(g.label)}</td><td class="num">${ct[0].groups[gi].n}</td>${ct.map(c => { const m = c.groups[gi].mean; const ms = c.groups.filter(x => x.n>=2 && isFinite(x.mean)).map(x => x.mean);
        const hi = ms.length > 1 && m === Math.max(...ms), lo = ms.length > 1 && m === Math.min(...ms);
        return `<td class="num" style="${isFinite(m) ? `background:color-mix(in srgb,var(--lv-${level(m)}) ${14}%,transparent)` : ''}">${isFinite(m) && c.groups[gi].n >= 2 ? `${hi?'▲ ':lo?'▼ ':''}${fmt(m)}` : '<span class="muted">—</span>'}</td>`; }).join('')}</tr>`).join('')}
      </tbody><tfoot><tr><td><b>${t('anovaRow')}</b></td><td></td>${ct.map(c => `<td class="num">${c.test ? `F = ${fmt(c.test.F)}<br>p = ${fmtP(c.test.p)} · η² = ${fmt(c.test.eta)}<br><span class="pill ${c.test.p < .05 ? 'orange' : ''}">${c.test.p < .05 ? t('sig') : t('notSig')}</span>` : '—'}</td>`).join('')}</tr></tfoot></table></div></section>`; } }
  // per question
  const perQ = `<section class="card"><div class="card-head"><div><h2>${t('qResults')}</h2></div></div>${likertLegend()}
    ${S.survey.sections.map(sec => { const its = sec.items.map(q => A.items[q.id]).filter(i => i && i.q.type !== 'open'); if (!its.length) return '';
      const so = A.sections.find(s => s.sec.id === sec.id);
      return `<div style="margin-top:18px"><div class="sec-title-row"><h3>${esc(sec.title)}</h3>${so ? `<span class="small muted">${t('colMean')} ${fmt(so.mean)} · ${lvChip(so.level)}</span>` : ''}</div>
      ${its.map(it => `<div class="item-res"><div><div class="qtext"><span class="qn">Q${it.no}</span> ${esc(it.q.text)}</div>
        ${it.q.type === 'likert' ? `<div class="stats"><span>n <b>${it.n}</b></span><span>${t('colMean')} <b>${fmt(it.mean)}</b></span><span>${t('colSD')} <b>${fmt(it.sd)}</b></span>${lvChip(it.level)}</div>` : `<div class="stats"><span>n <b>${it.n}</b></span><span>${typeLabel(it.q.type)}</span></div>`}</div>
        <div>${it.q.type === 'likert' ? stackbar(it.counts, it.n) : hbars(it.opts, it.counts, it.n, 'var(--c3)')}</div></div>`).join('')}</div>`; }).join('')}</section>`;
  // open ended
  const opens = Object.values(A.items).filter(i => i.q.type === 'open');
  const openSec = opens.length ? `<section class="card"><div class="card-head"><div><h2>${t('openTitle')}</h2></div></div><div class="stack-v">${opens.map(it => { const th = themesFor(A, it.q.id); const kw = keywords(it.answers);
    return `<div class="chart-card"><h3><span><span class="qn">Q${it.no}</span> ${esc(it.q.text)}</span><span class="muted small">${t('answersN',{n:it.n})}</span></h3>
      ${!it.n ? `<p class="muted">${t('noAnswers')}</p>` : `
      <div class="row" style="margin-bottom:10px"><button class="btn sm" data-act="themes" data-qid="${it.q.id}" ${S.ai ? '' : 'disabled'}>${I.spark}${th ? t('themesAgain') : t('themesAI')}</button>${S.ai ? '' : `<span class="small muted">${t('aiNeedKey')}</span>`}</div>
      ${th ? `<p class="small muted" style="margin-bottom:8px">${t('themesNote',{n:th.n})}</p><div class="grid2">${th.themes.map(x => `<div class="theme-item"><div class="th"><span>${esc(x.theme)}</span><span class="pill teal">${x.count}</span></div><span class="small">${esc(x.description)}</span>${x.quote ? `<q>${esc(x.quote)}</q>` : ''}</div>`).join('')}</div>`
        : `<div class="lbl-strong small" style="margin-bottom:6px">${t('keywords')}</div>${hbars(kw.map(k=>k[0]), kw.map(k=>k[1]), it.n, 'var(--c2)')}`}
      <div class="lbl-strong small" style="margin:12px 0 6px">${t('sampleAnswers')}</div><div class="answers">${it.answers.slice(0, 5).map(a => `<div>${esc(a)}</div>`).join('')}</div>`}</div>`; }).join('')}</div></section>` : '';
  // insights
  const prLbl = p => `<span class="pill ${p==='high'?'bad':p==='medium'?'warn':'teal'}">${t('pr_'+p)}</span>`;
  const insSec = `<section class="card"><div class="card-head"><div><h2>${t('insightsTitle')}</h2><p>${t('insightsLead')}</p></div>
      <div class="row"><span class="pill ${ins.source==='ai'?'teal':''}">${ins.source === 'ai' ? t('srcAI',{d:new Date(ins.at).toLocaleDateString(S.lang==='ar'?'ar-SA-u-nu-latn':'en-GB')}) : t('srcRules')}</span><button class="btn sm" data-act="refine" ${S.ai?'':'disabled'}>${I.spark}${t('refineAI')}</button></div></div>
    ${ins.summary ? `<p style="margin-bottom:16px;max-width:80ch">${esc(ins.summary)}</p>` : ''}
    <div class="ins-grid">
      <div class="chart-card"><h3>${t('findings')}</h3><ol class="ins-list">${ins.findings.map(f => `<li>${esc(f)}</li>`).join('')}</ol></div>

    </div>
    <div class="chart-card" style="margin-top:14px"><h3>${t('recommendations')}</h3>${ins.recs.slice().sort((a,b)=>['high','medium','low'].indexOf(a.priority)-['high','medium','low'].indexOf(b.priority)).map(r => `<div class="rec">${prLbl(r.priority)}<div><div>${esc(r.action)}</div><div class="meta">${r.challenge ? esc(t('linked',{c:r.challenge})) + ' · ' : ''}${esc(t('timeframe',{t:r.timeframe}))}</div></div></div>`).join('')}</div>
    <div class="ins-grid" style="margin-top:14px">
      <div class="chart-card"><h3>${t('limitations')}</h3><ul class="ins-list">${ins.limits.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
      <div class="chart-card"><h3>${t('future')}</h3><ul class="ins-list">${ins.future.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
    </div></section>`;
  return head + `<div class="stack-v">${src === 'demo' ? `<div class="banner">${I.info}<span>${t('demoBanner',{n:A.n})}</span></div>` : ''}${kpis}${dem}${secs}${cross}${perQ}${openSec}${insSec}</div>`;
}

/* ---------------- PDF report ---------------- */
const RP_CAT = ['#2a8574','#eb6834','#2a78d6','#eda100','#e87ba4','#4a3aa7','#e34948','#008300'];
const RP_LV = { vlow:'#d03b3b', low:'#ec835a', mod:'#9aa6b6', high:'#4fae98', vhigh:'#1f6659' };
const RP_LK = ['#d95926','#f0a07c','#d9d8d4','#7cc3b3','#2a8574'];
function rpBars(labels, counts, n, color){ const mx = Math.max(1, ...counts); return labels.map((l,i) => `<div class="rb"><span>${esc(l)}</span><span class="t"><span style="width:${counts[i]/mx*100}%;background:${color||'#2a8574'}"></span></span><span>${counts[i]} (${fmt(pct(counts[i],n),1)}%)</span></div>`).join(''); }
function reportBlocks(A, ins){
  const sv = S.survey; const B = []; const lv = l => l ? `<span class="sw" style="background:${RP_LV[l]}"></span>${t('lv_'+l)}` : '—';
  const dateStr = new Date().toLocaleDateString(S.lang === 'ar' ? 'ar-SA-u-nu-latn' : 'en-GB', { year:'numeric', month:'long', day:'numeric' });
  const add = (html, np) => B.push({ html, np });
  // exec summary
  add(`<h2>${t('rpExec')}</h2>${A.src==='demo' ? `<div><span class="demo-flag">${t('rpDemoFlag')}</span></div>` : ''}<p>${esc(ins.summary)}</p>
    <div class="kp"><div><small>${t('rpSample')}</small><strong>${A.n}</strong></div><div><small>${t('rpCompletion')}</small><strong>${fmt(A.completion,1)}%</strong></div><div><small>${t('rpOverall')}</small><strong>${fmt(A.overall.mean)}</strong> <small>${lv(A.overall.level)}</small></div></div>`, true);
  add(`<h3>${t('rpFind')}</h3><ol>${ins.findings.slice(0, 5).map(f => `<li>${esc(f)}</li>`).join('')}</ol>`);
  // method
  const cnt = { likert:0, mc:0, yesno:0, open:0 }; sv.sections.forEach(s => s.items.forEach(q => cnt[q.type]++));
  const per = A.period ? `${new Date(A.period[0]).toLocaleDateString(S.lang==='ar'?'ar-SA-u-nu-latn':'en-GB')} – ${new Date(A.period[1]).toLocaleDateString(S.lang==='ar'?'ar-SA-u-nu-latn':'en-GB')}` : '—';
  add(`<h2>${t('rpMethod')}</h2><table><tbody>
    <tr><th style="width:26%">${t('rpDesign')}</th><td>${t('rpDesignTxt')}</td></tr>
    <tr><th>${t('rpInstrument')}</th><td>${t('rpInstrumentTxt',{ s: sv.sections.length, q: countQ(sv), l: cnt.likert, m: cnt.mc, y: cnt.yesno, o: cnt.open, d: demoOn().length })}</td></tr>
    <tr><th>${t('rpSample')}</th><td>${t('rpSampleTxt',{ n: A.n, s: A.started, c: fmt(A.completion,1) })}</td></tr>
    <tr><th>${t('rpPeriod')}</th><td>${per}</td></tr>
    <tr><th>${t('rpAnalysis')}</th><td>${t('rpAnalysisTxt',{ a: ALPHA_MIN })}</td></tr></tbody></table>`, true);
  add(`<h3>${t('rpScale')}</h3><table><thead><tr><th>${t('rpRange')}</th><th>${t('colLevel')}</th></tr></thead><tbody>${LEVELS.map(([k,r]) => `<tr><td>${r}</td><td>${lv(k)}</td></tr>`).join('')}</tbody></table>`);
  // demographics
  const df = Object.keys(A.demo);
  df.forEach((f, i) => { const d = A.demo[f];
    add(`${i===0 ? `<h2>${t('rpDemo')}</h2>` : ''}<div class="box"><h3 style="margin-bottom:8px">${t('d_'+f)} <span style="color:#94a3b8;font-weight:400;font-size:11px">n = ${d.n}</span></h3>
      ${d.opts.length <= 4 ? `<div style="display:flex;gap:18px;align-items:center"><canvas width="220" height="220" style="width:110px;height:110px" data-donut='${JSON.stringify(d.counts)}'></canvas><div style="flex:1">${d.opts.map((o,j) => `<div class="rb" style="grid-template-columns:1fr 90px"><span><span class="sw" style="background:${RP_CAT[j%8]}"></span>${esc(o)}</span><span>${d.counts[j]} (${fmt(pct(d.counts[j],d.n),1)}%)</span></div>`).join('')}</div></div>` : rpBars(d.opts, d.counts, d.n)}</div>`, i === 0); });
  // sections overview
  add(`<h2>${t('rpResults')}</h2><table><thead><tr><th>${t('colSection')}</th><th class="n">${t('colItems')}</th><th class="n">${t('colMean')}</th><th class="n">${t('colSD')}</th><th>${t('colLevel')}</th><th class="n">α</th></tr></thead><tbody>
    ${A.sections.map(s => `<tr><td>${esc(s.sec.title)}</td><td class="n">${s.items.length}</td><td class="n"><b>${fmt(s.mean)}</b></td><td class="n">${fmt(s.sd)}</td><td>${lv(s.level)}</td><td class="n">${s.alpha == null ? '—' : fmt(s.alpha)}</td></tr>`).join('')}</tbody></table>
    <div class="box">${A.sections.map(s => `<div class="rb"><span>${esc(s.sec.title)}</span><span class="t"><span style="width:${(s.mean||0)/5*100}%;background:${RP_LV[s.level]||'#9aa6b6'}"></span></span><span><b>${fmt(s.mean)}</b> / 5</span></div>`).join('')}</div>`, true);
  sv.sections.forEach(sec => { const its = sec.items.map(q => A.items[q.id]).filter(Boolean); const lk = its.filter(i => i.q.type === 'likert'); const so = A.sections.find(s => s.sec.id === sec.id);
    if (lk.length) add(`<h3>${esc(sec.title)}${so ? ` <span style="font-weight:400;color:#64748b;font-size:12px">· M = ${fmt(so.mean)} (${t('lv_'+so.level)})</span>` : ''}</h3>
      <table><thead><tr><th>#</th><th>${t('rpQ')}</th>${[1,2,3,4,5].map(k => `<th class="n"><span class="sw" style="background:${RP_LK[k-1]}"></span>${k}</th>`).join('')}<th class="n">${t('colMean')}</th><th class="n">${t('colSD')}</th><th>${t('colLevel')}</th></tr></thead><tbody>
      ${lk.map(i => `<tr><td>Q${i.no}</td><td>${esc(i.q.text)}<div class="stk" style="margin-top:4px">${i.counts.map((c,k) => c ? `<span style="width:${pct(c,i.n)}%;background:${RP_LK[k]}"></span>` : '').join('')}</div></td>${i.counts.map(c => `<td class="n">${fmt(pct(c,i.n),0)}%</td>`).join('')}<td class="n"><b>${fmt(i.mean)}</b></td><td class="n">${fmt(i.sd)}</td><td>${lv(i.level)}</td></tr>`).join('')}</tbody></table>
      <div style="font-size:10px;color:#64748b">${[1,2,3,4,5].map(k => `<span class="sw" style="background:${RP_LK[k-1]}"></span>${k} = ${t('lk'+k)}`).join(' &nbsp; ')}</div>`);
    its.filter(i => i.q.type === 'mc' || i.q.type === 'yesno').forEach(i => add(`<div class="box"><h3 style="margin-bottom:6px">Q${i.no}. ${esc(i.q.text)}</h3>${rpBars(i.opts, i.counts, i.n, '#2a78d6')}</div>`)); });
  // open themes
  const opens = Object.values(A.items).filter(i => i.q.type === 'open' && i.n);
  opens.forEach((i, k) => { const th = themesFor(A, i.q.id); const kw = keywords(i.answers).slice(0, 6);
    add(`${k===0 ? `<h2>${t('rpOpen')}</h2>` : ''}<div class="box"><h3 style="margin-bottom:6px">Q${i.no}. ${esc(i.q.text)} <span style="font-weight:400;color:#94a3b8;font-size:11px">(${t('answersN',{n:i.n})})</span></h3>
      ${th ? `<table><thead><tr><th>${t('rpType')}</th><th class="n">n</th><th>${t('rpQ')}</th></tr></thead><tbody>${th.themes.map(x => `<tr><td><b>${esc(x.theme)}</b></td><td class="n">${x.count}</td><td>${esc(x.description)}${x.quote ? `<br><i style="color:#64748b">“${esc(x.quote)}”</i>` : ''}</td></tr>`).join('')}</tbody></table>`
        : `<div style="font-size:11px;color:#64748b;margin-bottom:4px">${t('keywords')}</div>${rpBars(kw.map(x=>x[0]), kw.map(x=>x[1]), i.n, '#eb6834')}`}</div>`, k === 0); });
  // group comparisons
  Object.keys(A.cross).forEach((f, k) => { const ct = A.cross[f]; if (!ct.length) return;
    add(`${k===0 ? `<h2>${t('rpGroups')}</h2>` : ''}<h3>${t('crossTitle')} · ${t('rpBy',{f:t('d_'+f)})}</h3><table><thead><tr><th>${t('colGroup')}</th><th class="n">n</th>${A.sections.map(s => `<th class="n">${esc(s.sec.title)}</th>`).join('')}</tr></thead><tbody>
      ${ct[0].groups.map((g, gi) => `<tr><td>${esc(g.label)}</td><td class="n">${g.n}</td>${ct.map(c => `<td class="n">${c.groups[gi].n >= 2 ? fmt(c.groups[gi].mean) : '—'}</td>`).join('')}</tr>`).join('')}
      <tr><th>${t('anovaRow')}</th><th></th>${ct.map(c => `<th class="n" style="font-weight:400">${c.test ? `F=${fmt(c.test.F)}, p=${fmtP(c.test.p)}${c.test.p < .05 ? ' ★' : ''}` : '—'}</th>`).join('')}</tr></tbody></table>`, k === 0); });
  // findings, challenges, recs
  add(`<h2>${t('rpFind')}</h2><ol>${ins.findings.map(f => `<li>${esc(f)}</li>`).join('')}</ol>`, true);
